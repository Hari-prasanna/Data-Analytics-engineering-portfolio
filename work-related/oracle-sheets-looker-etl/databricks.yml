# databricks.yml
bundle:
  name: luu_beauty_stock_pipeline

resources:
  jobs:
    luu_beauty_stock_update:
      name: LUU_Beauty_Stock_Update
      
      # ⏱️ 1. SCHEDULE CONFIGURATION
      schedule:
        quartz_cron_expression: "0 40 5,14 ? * MON-FRI"
        timezone_id: "Europe/Berlin" 
        pause_status: "UNPAUSED"

      # 💻 2. CLUSTER CONFIGURATION (From your screenshot)
      job_clusters:
        - job_cluster_key: Job_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: m6gd.large
            num_workers: 0  # Exam Note: 0 workers = Single Node Cluster
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*, 4]
            custom_tags:
              cost_allocation: "50019562"

      # 🚀 3. TASK DEFINITIONS
      tasks:
        # --- Task 1: ETL ---
        - task_key: ETL_Task
          job_cluster_key: Job_cluster
          notebook_task:
            # DABs will automatically upload this local file to the workspace
            notebook_path: ./src/beauty_stocks.py
            source: WORKSPACE
          libraries:
            # Pinning versions to resolve the Databricks UI warning
            - pypi:
                package: oracledb==2.1.2 
            - pypi:
                package: gspread==6.1.0
            - pypi:
                package: oauth2client==4.1.3

        # --- Task 2: Notification ---
        - task_key: Notify_Task
          depends_on:
            - task_key: ETL_Task
          job_cluster_key: Job_cluster
          notebook_task:
            notebook_path: ./src/stock_notification_sender.py
            source: WORKSPACE