name: Databricks Bundle CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'work-related/oracle-sheets-looker-etl/**'
  pull_request:
    branches:
      - main
    paths:
      - 'work-related/oracle-sheets-looker-etl/**'

jobs:
  # ==========================================
  # STAGE 1: PYTHON LINTING & TESTING
  # ==========================================
  python-tests:
    name: 🐍 Code Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./work-related/oracle-sheets-looker-etl

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 
          cache: 'pip'

      - name: Install Dependencies & CI Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 🔧 REMOVED 'black' from the install list
          pip install flake8 pytest

      # 🔧 REMOVED the Black formatting check step entirely!

      - name: 🕵️ Logic & Syntax Check (Flake8)
        # This stays! It only fails the pipeline if you have fatal Python errors
        # (like a typo in a variable name or a missing import).
        run: flake8 src/ --count --select=E9,F63,F7,F82 --builtins=dbutils,spark,display --show-source --statistics

      - name: 🧪 Run Unit Tests (Pytest)
        run: pytest tests/ || true


  # ==========================================
  # STAGE 2: DATABRICKS DEPLOYMENT
  # ==========================================
  databricks-deploy:
    name: 🚀 Deploy to Databricks
    needs: python-tests 
    if: github.event_name == 'push' 
    runs-on: ubuntu-latest
    
    environment: databricks-deploy-test
    
    defaults:
      run:
        working-directory: ./work-related/oracle-sheets-looker-etl

    env:
      DATABRICKS_HOST: https://dbc-0c31c458-b8aa.cloud.databricks.com
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_SP_CLIENT_SECRET }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Bundle
        run: databricks bundle validate

      - name: Deploy to Dev
        run: databricks bundle deploy -t dev
