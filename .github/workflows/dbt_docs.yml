name: Publish dbt Docs to GitHub Pages

# Disabled — trigger manually from GitHub Actions tab when needed
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: tmdb-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Generate dbt docs
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          cd 03-2026-tmdb-elt-pipeline/cloud_pipeline/databricks_cloud
          dbt deps --profiles-dir .
          dbt docs generate --profiles-dir .

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '03-2026-tmdb-elt-pipeline/cloud_pipeline/databricks_cloud/target'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
