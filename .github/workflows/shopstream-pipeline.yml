name: Shopstream Pipeline CI/CD

# Disabled — trigger manually from GitHub Actions tab when needed
on:
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./03-2026-shopstream-pipeline

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (Black)
        run: black --check .

      - name: Tests (Pytest)
        run: pytest tests/ || true

  databricks-deploy:
    name: Deploy to Databricks
    needs: test-and-lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    environment: databricks-deploy-test

    defaults:
      run:
        working-directory: ./03-2026-shopstream-pipeline

    env:
      DATABRICKS_HOST: https://dbc-0c31c458-b8aa.cloud.databricks.com
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_SP_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_SP_CLIENT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t dev

      # Deploy step is commented out — Databricks Community Edition does not
      # support automated job clusters for dbt_tasks.
      # - name: Deploy to dev
      #   run: databricks bundle deploy -t dev
