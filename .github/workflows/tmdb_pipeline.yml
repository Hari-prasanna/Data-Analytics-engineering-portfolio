name: TMDB Databricks Cloud CI/CD

# Disabled — trigger manually from GitHub Actions tab when needed
on:
  workflow_dispatch:

jobs:
  cloud-deploy:
    runs-on: ubuntu-latest
    environment: tmdb-production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas requests boto3 dbt-databricks python-dotenv

      - name: Run Python S3 extraction
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: "hari-data-engineering-workspace"
        run: |
          cd 03-2026-tmdb-elt-pipeline/cloud_pipeline
          python extract_to_s3.py

      - name: Run dbt build
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          cd 03-2026-tmdb-elt-pipeline/cloud_pipeline/databricks_cloud
          dbt deps --profiles-dir .
          dbt debug --profiles-dir .
          dbt build --profiles-dir .
