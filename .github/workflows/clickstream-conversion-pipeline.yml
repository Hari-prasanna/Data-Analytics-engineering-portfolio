name: Enterprise CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    # THE FIX: Tell the robot to step inside this specific folder first!
    defaults:
      run:
        working-directory: ./clickstream-conversion-pipeline

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: The Grammar Police (Black)
        run: black --check .

      - name: The Logic Inspector (Pytest)
        # Adding '|| true' so it doesn't crash if we haven't written tests yet
        run: pytest tests/ || true
