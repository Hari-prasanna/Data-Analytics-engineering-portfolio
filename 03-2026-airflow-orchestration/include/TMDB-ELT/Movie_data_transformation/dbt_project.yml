# Name your project! Project names should contain only lowercase characters
# and underscores.
name: 'movie_data_transformation'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'movie_data_transformation'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         
  - "target"
  - "dbt_packages"

# Configuring models
models:
  movie_data_transformation:
    staging:
      +materialized: incremental
    marts:
      +materialized: table