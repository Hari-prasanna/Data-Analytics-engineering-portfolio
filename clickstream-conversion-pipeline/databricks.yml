# clickstream-conversion-pipeline/databricks.yml

bundle:
  name: shopstream-clickstream-pipeline

resources:
  jobs:
    shopstream_daily_run:
      name: "Shopstream Daily dbt Build"
      
      # Added a schedule block, starting paused just like your working example
      schedule:
        quartz_cron_expression: "0 0 6 * * ?" # 6:00 AM Daily
        timezone_id: "Europe/Berlin" 
        pause_status: "PAUSED"

      tasks:
        - task_key: run_dbt_models
          # Notice: No job_cluster_key or new_cluster defined!
          dbt_task:
            project_directory: ./shopstream_dbt
            commands:
              - "dbt deps"
              - "dbt build"

targets:
  dev:
    mode: development
    workspace: 
      host: https://dbc-0c31c458-b8aa.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-0c31c458-b8aa.cloud.databricks.com